<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Virtual  Ingresar</title>
<style>
  :root{
    --teal: #2fa8ad;
    --teal-dark: #1f7a80;
    --pattern: #4fbdc1;
    --navy: #16324a;
    --navy-2: #0f2740;
    --border: #d8dde3;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    
  }

  .page{
    display: flex;
    min-height: 100vh;
    width: 100%;
    background: #ffffff;
  }

  /* -------- LEFT PANEL -------- */
  .left-panel{
    position: relative;
    flex: 0 0 42%;
    max-width: 42%;
    background-color: var(--teal);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .left-panel::before{
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.35;
    background-image: url(campus.png);
    background-repeat: repeat;
    background-size: 130px 130px;
  }







 
  /* -------- RIGHT PANEL -------- */
  .right-panel{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    padding: 40px 24px;
  }

  .login-box{
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .logo-slot{
    width: 130px;
    height: 130px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-slot img{
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }


  .logo-slot .placeholder{
    width: 100%;
    height: 100%;
    border: 2px dashed var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 12px;
    padding: 8px;
  }

  .welcome{
    font-size: 22px;
    color: var(--navy);
    font-weight: 400;
    margin: 0;
  }

  .welcome strong{
    display: block;
    font-size: 30px;
    font-weight: 800;
    color: var(--navy-2);
    margin-top: 2px;
  }

  form{
    width: 100%;
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .input-group{
    position: relative;
    width: 100%;
  }

  .input-group input{
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
    color: #333;
    background: #fff;
    transition: border-color 0.15s ease;
  }

  .input-group input:focus{
    border-color: var(--teal);
  }

  .input-group .toggle-eye{
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;

    display: flex;
    align-items: center;
    padding: 4px;
  }

  .remember-row{
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    margin-top: -4px;
  }

  .remember-row input[type="checkbox"]{
    width: 16px;
    height: 16px;
    accent-color: var(--navy-2);
    cursor: pointer;
  }


  .btn-ingresar{
    align-self: flex-start;
    margin-top: 6px;
    background: var(--navy-2);
    color: #fff;
    border: none;
    padding: 13px 32px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn-ingresar:hover{
    background: var(--navy);
  }

</style>
</head>
<body>

<div class="page">

  <!-- Panel izquierdo: patrón teal + mockup app -->
  <div class="left-panel">
    <div class="app-promo">
      <div class="label-top">NUEVA APP</div>
      <div class="label-bottom">CAMPUS VIRTUAL</div>
      <div class="phones">
        <div class="phone back"></div>
        <div class="phone front">
          <div class="screen-row"></div>
          <div class="screen-row"></div>
          <div class="screen-row"></div>
          <div class="screen-row"></div>
          <div class="screen-row"></div>
          <div class="screen-row"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Panel derecho: formulario de login -->
  <div class="right-panel">
    <div class="login-box">

      <div class="logo-slot">
        <!-- Reemplaza el src por la ruta de tu logo -->
        <img src="https://www.campusvirtual.com.gt/images/Logo.png" alt="Logo Campus Virtual"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <
      </div>

      <p class="welcome">¡Bienvenido a<strong>Campus Virtual!</strong></p>

      <form onsubmit="return false;">
        <div class="input-group">
          <input type="text" name="usuario" placeholder="Usuario" autocomplete="username">
        </div>

        <div class="input-group">
          <input type="password" name="contrasena" id="passwordInput" placeholder="Contraseña" autocomplete="current-password">
          <button type="button" class="toggle-eye" onclick="togglePassword()" aria-label="Mostrar contraseña">
            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <div class="remember-row">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Recuérdame</label>
        </div>

        <button type="submit" class="btn-ingresar">Ingresar</button>
      </form>

    </div>
  </div>

</div>

</body>
</html>
